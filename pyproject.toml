[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gigachad-lite"
version = "0.1.1"
description = "Execute-only delegation CLI: let Claude Code and Codex hand work to each other"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
gigachad-lite = "gigachad_lite.cli:main"
gcl = "gigachad_lite.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gigachad_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: tests that run real agent CLIs"]

[tool.ruff]
target-version = "py39"
line-length = 110
